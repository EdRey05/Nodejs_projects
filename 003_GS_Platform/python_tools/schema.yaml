# Gene Synthesis Platform — canonical schema.
#
# Each top-level key is a "log type" group. Unless a `table:` override is
# present, the physical table name is "{log_type}_{table_name}" (see
# db_ops.resolve_table_name). The `job_log` group overrides it to the
# physical table `job_log` — the app's first table and the job spine.
#
# Column order here IS the table's column order (and the Job Log display
# order in the UI). Display labels live in the frontend; these names are
# the snake_case variable/column names used in SQL, Python and TypeScript.

job_log:
  table: job_log
  data:
    - {name: work_no, type: TEXT}
    - {name: bbi_id, type: TEXT}
    - {name: order_date, type: TEXT}
    - {name: so, type: TEXT}
    - {name: gene_name, type: TEXT}
    - {name: vector, type: TEXT}
    - {name: cloning_site, type: TEXT}
    - {name: resistance, type: TEXT}
    - {name: length_bp, type: INTEGER}
    - {name: quantity, type: TEXT}
    - {name: prep, type: TEXT}
    - {name: stage, type: TEXT}
    - {name: insert_sequence, type: TEXT}
    - {name: final_vector_sequence, type: TEXT}
    - {name: plasmid_no, type: TEXT}
    - {name: tube_id, type: TEXT}
    - {name: host, type: TEXT}
    - {name: temperature, type: TEXT}
    - {name: competent_cells, type: TEXT}
    - {name: notes, type: TEXT}

ligation:
  index:
    - {name: name, type: TEXT}
    - {name: id, type: INTEGER, primary_key: true}
  data:
    - {name: ligation_id, type: INTEGER}
    - {name: "Well ", type: TEXT}
    - {name: Name, type: TEXT}
    - {name: BBID, type: TEXT}
    - {name: "Vector ", type: TEXT}
    - {name: Enzyme, type: TEXT}
    - {name: Vector Lot, type: TEXT}
    - {name: Vector Position, type: TEXT}
    - {name: Vol of Vector, type: TEXT}
    - {name: Insert 1, type: TEXT}
    - {name: Well position, type: TEXT}
    - {name: Vol of Insert, type: TEXT}
    - {name: Insert 2, type: TEXT}
    - {name: Insert 3, type: TEXT}
    - {name: H2O Volume, type: TEXT}
    - {name: 2XHF, type: TEXT}
    - {name: Len, type: TEXT}
    - {name: Resistance, type: TEXT}
    - {name: worksheet1, type: TEXT}
    - {name: worksheet2, type: TEXT}

colony_pcr:
  index:
    - {name: name, type: TEXT}
    - {name: id, type: INTEGER, primary_key: true}
  data:
    - {name: colony_pcr_id, type: INTEGER}
    - {name: plate_id, type: INTEGER}
    - {name: Row, type: TEXT}
    - {name: C1, type: TEXT}
    - {name: C2, type: TEXT}
    - {name: C3, type: TEXT}
    - {name: C4, type: TEXT}
    - {name: C5, type: TEXT}
    - {name: C6, type: TEXT}
    - {name: C7, type: TEXT}
    - {name: C8, type: TEXT}
    - {name: C9, type: TEXT}
    - {name: C10, type: TEXT}
    - {name: C11, type: TEXT}
    - {name: C12, type: TEXT}
  samples:
    - {name: colony_pcr_id, type: INTEGER}
    - {name: plate_id, type: INTEGER}
    - {name: JobID, type: TEXT}
    - {name: BBID, type: TEXT}
    - {name: Vector, type: TEXT}
    - {name: Resistance, type: TEXT}
    - {name: Primers, type: TEXT}
    - {name: Length, type: TEXT}
  positives:
    - {name: colony_pcr_id, type: INTEGER}
    - {name: plate_id, type: INTEGER}
    - {name: well, type: TEXT}

dna_extraction:
  index:
    - {name: name, type: TEXT}
    - {name: id, type: INTEGER, primary_key: true}
  data:
    - {name: dna_extraction_id, type: INTEGER}
    - {name: plate_id, type: INTEGER}
    - {name: Row, type: TEXT}
    - {name: C1, type: TEXT}
    - {name: C2, type: TEXT}
    - {name: C3, type: TEXT}
    - {name: C4, type: TEXT}
    - {name: C5, type: TEXT}
    - {name: C6, type: TEXT}
    - {name: C7, type: TEXT}
    - {name: C8, type: TEXT}
    - {name: C9, type: TEXT}
    - {name: C10, type: TEXT}
    - {name: C11, type: TEXT}
    - {name: C12, type: TEXT}
  antibiotic:
    - {name: dna_extraction_id, type: INTEGER}
    - {name: plate_id, type: INTEGER}
    - {name: well_id, type: TEXT}
    - {name: value, type: TEXT}
  temperature:
    - {name: dna_extraction_id, type: INTEGER}
    - {name: plate_id, type: INTEGER}
    - {name: well_id, type: TEXT}
    - {name: value, type: TEXT}
  bacteria:
    - {name: dna_extraction_id, type: INTEGER}
    - {name: plate_id, type: INTEGER}
    - {name: well_id, type: TEXT}
    - {name: value, type: TEXT}
  incubation:
    - {name: dna_extraction_id, type: INTEGER}
    - {name: plate_id, type: INTEGER}
    - {name: well_id, type: TEXT}
    - {name: value, type: TEXT}
  prep:
    - {name: dna_extraction_id, type: INTEGER}
    - {name: plate_id, type: INTEGER}
    - {name: well_id, type: TEXT}
    - {name: value, type: TEXT}

dna_quantification:
  index:
    - {name: name, type: TEXT}
    - {name: id, type: INTEGER, primary_key: true}
    - {name: source, type: TEXT}
    - {name: source_details, type: TEXT}
  extraction_plate:
    - {name: quantification_id, type: INTEGER}
    # Columns are somewhat dynamic in the current app, but usually include JobID, BBID etc.
    # For DuckDB I can add columns on the fly if needed, but I'll define common ones.
    - {name: JobID, type: TEXT}
    - {name: BBID, type: TEXT}
  fragments:
    - {name: quantification_id, type: INTEGER}
    - {name: JobID, type: TEXT}
    - {name: BBID, type: TEXT}
  other:
    - {name: quantification_id, type: INTEGER}
    - {name: JobID, type: TEXT}
    - {name: BBID, type: TEXT}
  nanodrop:
    - {name: quantification_id, type: INTEGER}
    - {name: row_number, type: INTEGER}
    - {name: concentration_ng_ul, type: REAL}
    - {name: a260_a280, type: REAL}
    - {name: a260_a230, type: REAL}
    - {name: a260, type: REAL}
    - {name: a280, type: REAL}

sequencing_layout:
  index:
    - {name: name, type: TEXT}
    - {name: id, type: INTEGER, primary_key: true}
    - {name: source, type: TEXT}
  data:
    - {name: sequencing_layout_id, type: INTEGER}
    - {name: row_number, type: INTEGER}
    - {name: well, type: TEXT}
    - {name: wo, type: TEXT}
    - {name: dna, type: TEXT}
    - {name: primer, type: TEXT}
    - {name: file_name, type: TEXT}
  plate:
    - {name: sequencing_layout_id, type: INTEGER}
    - {name: row_letter, type: TEXT}
    - {name: col, type: INTEGER}
    - {name: field, type: TEXT}
    - {name: value, type: TEXT}

sequencing_order:
  index:
    - {name: name, type: TEXT}
    - {name: id, type: INTEGER, primary_key: true}
    - {name: source, type: TEXT}
    - {name: plate_name, type: TEXT}
  data:
    - {name: sequencing_order_id, type: INTEGER}
    - {name: row_number, type: INTEGER}
    - {name: well_pos, type: TEXT}
    - {name: sample_type, type: TEXT}
    - {name: seq_sample_id, type: TEXT}
    - {name: seq_primer_id, type: TEXT}
    - {name: file_name_request, type: TEXT}
    - {name: conc_est, type: TEXT}
    - {name: comment, type: TEXT}
    - {name: dna_position, type: TEXT}
    - {name: layout_wo, type: TEXT}
    - {name: new_primer_id, type: TEXT}
    - {name: new_file_name, type: TEXT}

sequencing_validation:
  index:
    - {name: name, type: TEXT}
    - {name: id, type: INTEGER, primary_key: true}
    - {name: source, type: TEXT}
  pending:
    - {name: sequencing_validation_id, type: INTEGER}
    - {name: row_number, type: INTEGER}
    - {name: jobid, type: TEXT}
    - {name: bbid, type: TEXT}
    - {name: plasmid_id, type: TEXT}
    - {name: notes, type: TEXT}
    - {name: ng_ul, type: TEXT}
    - {name: a260_280, type: TEXT}
    - {name: a260_230, type: TEXT}
    - {name: seq_rx, type: TEXT}
    - {name: seq_plate_well, type: TEXT}
  dilution:
    - {name: sequencing_validation_id, type: INTEGER}
    - {name: row_number, type: INTEGER}
    - {name: jobid, type: TEXT}
    - {name: bbid, type: TEXT}
    - {name: plasmid_id, type: TEXT}
    - {name: seq_rx, type: TEXT}
    - {name: seq_plate_well, type: TEXT}
    - {name: conc, type: TEXT}
    - {name: dil_fact, type: TEXT}
    - {name: vol_to_prepare, type: TEXT}
    - {name: water_vol, type: TEXT}
    - {name: dna_vol, type: TEXT}

seq_log:
  index:
    - {name: name, type: TEXT}
    - {name: id, type: INTEGER, primary_key: true}
    - {name: log_date, type: TEXT}
    - {name: version, type: TEXT}
    - {name: source, type: TEXT}
  data:
    - {name: seq_log_id, type: INTEGER}
    - {name: row_number, type: INTEGER}
    - {name: folder_name, type: TEXT}
    - {name: job_id, type: TEXT}
    - {name: vector_id, type: TEXT}
